services:
  postgres:
    image: postgres:16-alpine
    container_name: dq_triage_pg
    environment:
      POSTGRES_USER: dq
      POSTGRES_PASSWORD: dq
      POSTGRES_DB: dq_triage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
