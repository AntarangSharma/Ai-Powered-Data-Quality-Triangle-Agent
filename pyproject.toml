[project]
name = "dq-triage"
version = "0.0.1"
description = "AI-powered data quality triage agent — root-cause attribution with row-level precision"
readme = "README.md"
authors = [{ name = "Antarang Sharma" }]
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
    # core
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
    "rich>=13.7,<14",
    "structlog>=24.1,<25",
    # warehouse + dbt
    "duckdb==0.10.2",
    "dbt-core==1.8.1",
    "dbt-duckdb==1.8.1",
    # lineage
    "sqlglot[rs]>=23.0,<26",
    "networkx>=3.2,<4",
    # data
    "pandas>=2.2,<3",
    "polars>=0.20,<2",
    # LLM
    "anthropic>=0.34,<1",
    "instructor>=1.3,<2",
    "diskcache>=5.6,<6",
    # store
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    # slack
    "slack-sdk>=3.27,<4",
    # api
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    # eval
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<6",
    "pytest-xdist>=3.6,<4",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "pre-commit>=3.7,<4",
    "ipython>=8.25,<9",
]

[project.scripts]
dq-triage = "dq_triage.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dq_triage"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires duckdb + dbt project",
    "llm: makes a real LLM call (skip with -m 'not llm')",
]
